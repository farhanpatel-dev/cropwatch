# Lint and test every service and the frontend on each push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inference, gateway, geo]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    services:
      # Only the geo tests use it; they skip without TEST_DATABASE_URL.
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cropwatch
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: cropwatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cropwatch"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cropwatch:ci_only_password@localhost:5432/cropwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
