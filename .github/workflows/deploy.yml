# Deploy to AWS (ADR 0004) whenever main changes, or by hand from the Actions tab.
# Uses the role from infra/aws/github-deploy.yaml; no AWS keys are stored in GitHub.
name: Deploy

on:
  push:
    branches: [main]
    paths: [services/**, frontend/**, infra/aws/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  id-token: write # lets the job ask GitHub for the OIDC token AWS checks
  contents: read

# One deploy at a time; a newer push waits instead of running in parallel.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Native arm64, the same architecture as the Lambda functions.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::454299228940:role/github-deploy-cropwatch
          aws-region: us-east-2
      - uses: docker/setup-buildx-action@v3
      - run: bash infra/aws/deploy.sh
