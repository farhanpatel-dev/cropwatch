# CropWatch local stack. Start with: docker compose up -d
# Values like ${POSTGRES_USER} come from the .env file next to this one.
name: cropwatch

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Host port is configurable: a PostgreSQL installed on the computer may already use 5432.
      - "${POSTGIS_HOST_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./infra/docker/postgis/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  inference:
    build: ./services/inference
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/models/model.onnx}
      MODEL_INFO_PATH: ${MODEL_INFO_PATH:-/app/models/model_info.json}
      TILE_SIZE: ${TILE_SIZE:-256}
      TILE_OVERLAP: ${TILE_OVERLAP:-32}
    ports:
      - "8001:8001"
    # Health check is defined in services/inference/Dockerfile.
    restart: unless-stopped

  geo:
    build: ./services/geo
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    ports:
      - "8002:8002"
    depends_on:
      postgis:
        condition: service_healthy
    # Health check (with a database SELECT 1) is defined in services/geo/Dockerfile.
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    environment:
      INFERENCE_URL: ${INFERENCE_URL:-http://inference:8001}
      GEO_URL: ${GEO_URL:-http://geo:8002}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      inference:
        condition: service_healthy
      geo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgis-data:
  mlflow-data:
